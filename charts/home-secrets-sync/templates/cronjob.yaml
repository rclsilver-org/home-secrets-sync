apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "home-secrets-sync.name" . }}
  labels:
    {{- include "home-secrets-sync.labels" . | nindent 4 }}
spec:
  schedule: {{ .Values.schedule | quote }}
  timeZone: {{ .Values.timeZone | quote }}
  suspend: {{ .Values.suspend }}
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: {{ .Values.startingDeadlineSeconds }}
  successfulJobsHistoryLimit: {{ .Values.successfulJobsHistoryLimit }}
  failedJobsHistoryLimit: {{ .Values.failedJobsHistoryLimit }}
  jobTemplate:
    spec:
      backoffLimit: {{ .Values.backoffLimit }}
      activeDeadlineSeconds: {{ .Values.activeDeadlineSeconds }}
      template:
        metadata:
          labels:
            {{- include "home-secrets-sync.labels" . | nindent 12 }}
            {{- with .Values.podLabels }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with .Values.podAnnotations }}
          annotations:
            {{- toYaml . | nindent 12 }}
          {{- end }}
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          {{- with .Values.imagePullSecrets }}
          imagePullSecrets:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            fsGroup: 10001
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: sync
              image: {{ include "home-secrets-sync.image" . | quote }}
              imagePullPolicy: {{ .Values.image.pullPolicy }}
              command: [/bin/sh, -ec]
              args:
                - |
                  umask 077
                  mkdir -p /run/home-secrets-sync/private
                  chmod 0700 /run/home-secrets-sync/private
                  {{- if .Values.caConfigMap }}
                  cat /etc/ssl/certs/ca-certificates.crt /etc/home-secrets-sync/ca/ca.crt > /run/home-secrets-sync/private/ca-bundle.crt
                  export SSL_CERT_FILE=/run/home-secrets-sync/private/ca-bundle.crt
                  export NODE_EXTRA_CA_CERTS=/etc/home-secrets-sync/ca/ca.crt
                  {{- end }}
                  exec /usr/local/bin/home-secrets-sync -config /etc/home-secrets-sync/config.json{{ if not .Values.dryRun }} -apply{{ end }}
              envFrom:
                - secretRef:
                    name: {{ .Values.existingSecret | quote }}
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: [ALL]
              resources:
                {{- toYaml .Values.resources | nindent 16 }}
              volumeMounts:
                - name: config
                  mountPath: /etc/home-secrets-sync
                  readOnly: true
                - name: runtime
                  mountPath: /run/home-secrets-sync
                {{- if .Values.caConfigMap }}
                - name: ca
                  mountPath: /etc/home-secrets-sync/ca
                  readOnly: true
                {{- end }}
          volumes:
            - name: config
              configMap:
                name: {{ include "home-secrets-sync.name" . }}
            - name: runtime
              emptyDir:
                medium: Memory
                sizeLimit: {{ .Values.runtimeSizeLimit }}
            {{- if .Values.caConfigMap }}
            - name: ca
              configMap:
                name: {{ .Values.caConfigMap | quote }}
                items:
                  - key: ca.crt
                    path: ca.crt
            {{- end }}
          {{- with .Values.nodeSelector }}
          nodeSelector:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.tolerations }}
          tolerations:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.affinity }}
          affinity:
            {{- toYaml . | nindent 12 }}
          {{- end }}
