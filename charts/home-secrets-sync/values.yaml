image:
  repository: ghcr.io/rclsilver-org/home-secrets-sync
  tag: "" # Defaults to Chart.appVersion.
  digest: "" # Takes precedence over tag when set.
  pullPolicy: IfNotPresent
imagePullSecrets: []

# Installation starts suspended (0 replicas) and in dry-run mode: review the logs of a
# dry-run before enabling writes. The daemon synchronizes once per interval (>= 1m).
interval: 5m
suspend: true
dryRun: true

existingSecret: home-secrets-sync-credentials
podLabels: {}
podAnnotations: {}
nodeSelector: {}
tolerations: []
affinity: {}

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: "1"
    memory: 768Mi
runtimeSizeLimit: 128Mi

# Persists the Vaultwarden CLI profile (device identity and API login) between runs.
# It holds API tokens but neither the master password nor the session key.
persistence:
  existingClaim: "" # Use this PVC instead of creating one.
  storageClass: "" # Empty uses the cluster default.
  size: 100Mi

# References only. Never store credentials or exported values in Helm values.
# runtimeDir, stateDir and binary are fixed by the chart to its RAM volume and bundled CLI.
config:
  sourceID: example-source
  vaultwarden:
    server: https://vaultwarden.example.invalid
    # Stable UUID (not a secret) so Vaultwarden sees one known device instead of
    # a new one per run, which would send a notification mail every time.
    deviceID: ""
  destinations:
    infisical:
      url: https://infisical.example.invalid
      projects:
        backend-secrets:
          id: REPLACE_WITH_PROJECT_UUID
          environments: [production]
          pathPrefixes: [/aiga]

# Optional extra public CA bundle in an existing ConfigMap, key ca.crt.
# This augments Node's trust and supplies Go with a complete system+custom bundle.
caConfigMap: ""

# Opt-in because the actual egress selectors/CIDRs depend on the cluster.
networkPolicy:
  enabled: false
  egress: []
