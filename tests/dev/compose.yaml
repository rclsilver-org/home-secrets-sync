# Development fixtures only. Never substitute production credentials here.
name: home-secrets-sync-dev
services:
  postgres:
    image: postgres:18-alpine@sha256:10a5c69a83035ab5239f5620d708520e8b28f5aa1f2b20143e6024532edadfb5
    environment:
      POSTGRES_DB: infisical_dev
      POSTGRES_USER: infisical_dev
      POSTGRES_PASSWORD: development-fixture-database-password
      PGDATA: /data/postgres
    user: "70:70"
    tmpfs:
      - /data:uid=70,gid=70,mode=0700,size=512m
      - /var/run/postgresql:uid=70,gid=70,mode=0770,size=16m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 512m
    cpus: 1
    healthcheck:
      test: [CMD, pg_isready, -U, infisical_dev, -d, infisical_dev]
      interval: 5s
      timeout: 3s
      retries: 30
  redis:
    image: redis:7.4-alpine@sha256:8da19c7399dca900c6822a1cf30f9d2285585e2c4b457ff4095b0f4500054d3f
    command: [redis-server, --save, "", --appendonly, "no", --maxmemory, 64mb, --maxmemory-policy, noeviction, --requirepass, development-fixture-redis-password]
    environment:
      REDISCLI_AUTH: development-fixture-redis-password
    user: "999:999"
    tmpfs:
      - /data:uid=999,gid=999,mode=0700,size=32m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 128m
    cpus: 0.5
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 30
  vaultwarden:
    image: vaultwarden/server:1.37.4@sha256:efb3cde962015fcc036b2ea625242248611943b27212ebf4392841fb30fad055
    environment:
      ROCKET_PORT: "8443"
      ROCKET_TLS: '{certs="/data/dev-tls.crt",key="/data/dev-tls.key"}'
      SIGNUPS_ALLOWED: "true"
      # Integration tests deliberately perform many fresh CLI logins.
      # Keep production's rate limiting unchanged.
      LOGIN_RATELIMIT_SECONDS: "1"
      LOGIN_RATELIMIT_MAX_BURST: "100"
      WEB_VAULT_ENABLED: "false"
      DATA_FOLDER: /data
      ICON_SERVICE: internal
    entrypoint: [/bin/sh, -ec]
    command:
      - |
        dev_address=$$(hostname -i | awk '{print $$1}')
        export DOMAIN="https://$$dev_address:8443"
        openssl req -x509 -newkey rsa:2048 -nodes -days 30 -subj /CN=secrets-sync-dev \
          -addext "subjectAltName=DNS:vaultwarden,IP:127.0.0.1,IP:$$dev_address" \
          -keyout /data/dev-tls.key -out /data/dev-tls.crt 2>/dev/null
        exec /vaultwarden
    user: "1000:1000"
    tmpfs:
      - /data:uid=1000,gid=1000,mode=0700,size=128m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 256m
    cpus: 1
    healthcheck:
      test: [CMD, curl, --fail, --silent, --cacert, /data/dev-tls.crt, https://127.0.0.1:8443/alive]
      interval: 5s
      timeout: 3s
      retries: 30
  infisical:
    image: infisical/infisical:v0.167.4@sha256:80a3bb51bee4092b7332d000506d5740ba57b1c4d48550e50746fe9c5209715d
    environment:
      SITE_URL: http://infisical:8080
      DB_CONNECTION_URI: postgres://infisical_dev:development-fixture-database-password@postgres:5432/infisical_dev
      REDIS_URL: redis://:development-fixture-redis-password@redis:6379
      ENCRYPTION_KEY: "0123456789abcdef0123456789abcdef"
      AUTH_SECRET: "ZGV2ZWxvcG1lbnQtZml4dHVyZS1hdXRoLWtleS0xMjM="
      TELEMETRY_ENABLED: "false"
      OTEL_TELEMETRY_COLLECTION_ENABLED: "false"
      NODE_OPTIONS: --max-old-space-size=1536
      DEVELOPMENT_FIXTURES_ONLY: "true"
    tmpfs:
      - /scratch:uid=1001,gid=1001,mode=0700,size=32m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 2g
    cpus: 2
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      vaultwarden:
        condition: service_healthy
    healthcheck:
      test: [CMD, curl, --fail, --silent, http://127.0.0.1:8080/api/status]
      start_period: 90s
      interval: 5s
      timeout: 3s
      retries: 60
networks:
  default:
    internal: true
