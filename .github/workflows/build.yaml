name: Build and release

on:
  push:
    branches: [master]
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SYNC_TEST_IMAGE: home-secrets-sync:dev
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set private scratch paths
        run: |
          printf 'SYNC_SCRATCH=%s\n' "$RUNNER_TEMP/home-secrets-sync" >> "$GITHUB_ENV"
          printf 'SECRETS_SYNC_DEV_SCRATCH=%s\n' "$RUNNER_TEMP/home-secrets-sync/dev" >> "$GITHUB_ENV"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: false
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4
        with:
          version: v4.2.4
      - name: Unit tests and static checks
        run: |
          go vet ./...
          go test -race ./...
          test -z "$(gofmt -l *.go)"
          bash -n tests/*.sh tests/dev/*.sh
      - name: Validate release versions
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "$(helm show chart charts/home-secrets-sync | awk '/^version:/ {print $2}')" = "${RELEASE_TAG#v}"
          grep -Fx "appVersion: \"$RELEASE_TAG\"" charts/home-secrets-sync/Chart.yaml
      - name: Build the exact runtime image
        run: docker build --build-arg VERSION="${GITHUB_REF_NAME}" --build-arg REVISION="${GITHUB_SHA}" -t "$SYNC_TEST_IMAGE" .
      - name: End-to-end tests with synthetic servers
        run: bash tests/dev/run.sh
      - uses: helm/kind-action@ef37e7f390d99f746eb8b610417061a60e82a6cc # v1
        with:
          version: v0.33.0
          cluster_name: home-secrets-sync-test
      - name: Chart rendering and Kubernetes smoke test
        run: |
          mkdir -p "$SYNC_SCRATCH"
          bash tests/chart.sh
          bash tests/chart-kind.sh

  publish:
    needs: verify
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      packages: write
    env:
      IMAGE: ghcr.io/rclsilver-org/home-secrets-sync
      CHART_REPO: oci://ghcr.io/rclsilver-org/charts
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4
        with:
          version: v4.2.4
      - name: Authenticate to GHCR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          printf '%s' "$GH_TOKEN" | helm registry login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - name: Publish the versioned multiarchitecture image
        id: image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.IMAGE }}:${{ env.RELEASE_TAG }},${{ env.IMAGE }}:latest
          build-args: |
            VERSION=${{ env.RELEASE_TAG }}
            REVISION=${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ env.RELEASE_TAG }}
            org.opencontainers.image.revision=${{ github.sha }}
      - name: Package and publish the chart
        run: |
          mkdir -p dist
          helm package charts/home-secrets-sync --destination dist
          helm push "dist/home-secrets-sync-${RELEASE_TAG#v}.tgz" "$CHART_REPO"
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          set -euo pipefail
          cat > dist/release.md <<EOF
          Selectively synchronize Vaultwarden fields to Infisical using item metadata.

          Image: \`$IMAGE:$RELEASE_TAG\` (Linux amd64 and arm64)
          Digest: \`$IMAGE_DIGEST\`
          Chart: \`$CHART_REPO/home-secrets-sync\`, version \`${RELEASE_TAG#v}\`

          The chart starts suspended and in dry-run mode. Supply credentials through an existing Kubernetes Secret.
          EOF
          gh release create "$RELEASE_TAG" --verify-tag --title "$RELEASE_TAG" \
            --notes-file dist/release.md "dist/home-secrets-sync-${RELEASE_TAG#v}.tgz"
